
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de reporte de animales">
    <title>Reportar Animal</title>
</head>
<body>

    <header>
        <h1>Reporte de Animal en Situación de Riesgo</h1>
        <p>Registra un animal que necesita ayuda.</p>

        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reportar.html">Reportar un animal</a></li>
                <li><a href="rescates.html">Lista de rescates</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulario de registro</h2>

            <form action="rescates.html" method="get">

                <fieldset>
                    <legend>Datos del reportante</legend>

                    <p>
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre"
                        required minlength="3" maxlength="80">
                    </p>

                    <p>
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" required>
                    </p>

                    <p>
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono"
                        required pattern="[0-9]{10}"
                        title="Ingrese 10 dígitos">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Información del animal</legend>

                    <p>
                        <label for="especie">Especie:</label>
                        <select id="especie" name="especie" required>
                            <option value="">Seleccione</option>
                            <option value="Perro">Perro</option>
                            <option value="Gato">Gato</option>
                            <option value="Fauna silvestre">Fauna silvestre</option>
                        </select>
                    </p>

                    <p>
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad" name="cantidad"
                        min="1" max="50" required>
                    </p>

                    <p>
                        <label for="fecha">Fecha del reporte:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </p>

                    <p>
                        <label for="ubicacion">Ubicación:</label>
                        <input type="text" id="ubicacion" name="ubicacion"
                        minlength="5" required>
                    </p>

                    <p>
                        <label for="estado">Situación del animal:</label>
                        <select id="estado" name="estado" required>
                            <option value="">Seleccione</option>
                            <option value="Abandonado">Abandonado</option>
                            <option value="Herido">Herido</option>
                            <option value="En peligro">En peligro</option>
                            <option value="Maltratado">Maltratado</option>
                        </select>
                    </p>

                    <p>
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" name="descripcion"
                        rows="5" cols="40" minlength="10"
                        maxlength="500" required></textarea>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Confirmación</legend>

                    <p>
                        <input type="checkbox" id="confirmacion"
                        name="confirmacion" required>
                        <label for="confirmacion">
                            Confirmo que la información es verdadera.
                        </label>
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Enviar reporte</button>
                    <button type="reset">Limpiar formulario</button>
                </p>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema de Rescate Animal.</p>
    </footer>

</body>
</html>
